apply plugin: 'com.android.application'

// Release signing is provided through environment variables (CI secrets).
// Without them the release build stays unsigned and falls back to a debug key.
def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
def ksStorePass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def ksKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def ksKeyPass = System.getenv("ANDROID_KEY_PASSWORD")

android {
    compileSdkVersion 29
    buildToolsVersion '29.0.2'

    defaultConfig {
        applicationId 'ru.meefik.linuxdeploy'
        minSdkVersion 21
        // API 28 must be frozen for binary execution
        targetSdkVersion 28
        versionCode 259
        versionName "2.6.0"
        vectorDrawables.useSupportLibrary true
    }

    if (ksPath) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ksPath) {
                signingConfig signingConfigs.release
            }
        }
    }
    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

task syncUbuntuBootstrap(type: Copy) {
    from "$rootDir/custom_env/include/bootstrap/ubuntu"
    into "$projectDir/src/main/assets/env/include/bootstrap/ubuntu"
}

task syncUbuntuDebootstrapScripts(type: Copy) {
    from "$rootDir/custom_env/include/bootstrap/debian/debootstrap/scripts"
    into "$projectDir/src/main/assets/env/include/bootstrap/debian/debootstrap/scripts"
}

preBuild.dependsOn syncUbuntuBootstrap, syncUbuntuDebootstrapScripts

dependencies {
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.browser:browser:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.squareup.okhttp3:okhttp:4.3.1'
    implementation 'androidx.preference:preference:1.1.0'
}
